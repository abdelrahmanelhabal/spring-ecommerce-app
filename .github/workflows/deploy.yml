name: Deploy Spring MVC

on:
  workflow_dispatch:
        inputs:
          version:
            description: "Docker image tag"
            required: true
            default: "latest"
env:
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || 'latest' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin
      
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/spring-mvc-app:${IMAGE_TAG} .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/spring-mvc-app:${IMAGE_TAG}

    
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 700 ~/.ssh/id_rsa
          ssh-keyscan -v -H ${{ secrets.BASTION_HOST }}
          
    
      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ secrets.BASTION_USER }}@${{ secrets.BASTION_HOST }} << 'EOF'
      
            ssh -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'INNER_EOF'
      
              cd /home/${{ secrets.EC2_USER }}/app
      
              docker compose pull
      
              docker compose up -d --force-recreate
      
              docker image prune -f
      
            INNER_EOF
      
          EOF
